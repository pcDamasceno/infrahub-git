query vlan_definition($name: String!) {
  NetworkVlanDefinition(name__value: $name) {
    edges {
      node {
        id
        name { value }
      }
    }
  }
  LocationSite {
    edges {
      node {
        id
        name { value }
      }
    }
  }
  NetworkVlan(name__value: $name) {
    edges {
      node {
        id
        site {
          node {
            id
          }
        }
      }
    }
  }
  CoreNumberPool(node__value: "NetworkVlan", node_attribute__value: "vlan_id") {
    edges {
      node {
        id
        name { value }
      }
    }
  }
}

query ibn_device_interfaces($device: String!) {
  DcimDevice(name__value: $device) {
    edges {
      node {
        id
        name { value }
        description { value }
        status { value }
        platform {
          node { name { value } }
        }
        interfaces {
          edges {
            node {
              name { value }
              description { value }
              enabled { value }
              status { value }
              mtu { value }
              ... on InterfaceLayer3 {
                vrf {
                  node { name { value } }
                }
                ip_addresses {
                  edges {
                    node {
                      address { value }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

---
# The site_vlans generator creates each VLAN definition at every site,
# and allocates its VLAN ID from the number pool for NetworkVlan.vlan_id
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: NetworkVlanDefinition
  data:
    - name: USERS
      member_of_groups:
        - ["vlan_definitions"]
    - name: VOICE
      member_of_groups:
        - ["vlan_definitions"]
    - name: MGMT
      member_of_groups:
        - ["vlan_definitions"]

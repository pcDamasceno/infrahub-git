# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
---
version: "1.0"
nodes:
  - name: Site
    namespace: Location
    label: Site
    icon: mdi:office-building-marker
    display_label: "{{ name__value }}"
    human_friendly_id: ["name__value"]
    attributes:
      - name: name
        kind: Text
        unique: true
      - name: city
        kind: Text
        optional: true
    relationships:
      - name: devices
        peer: NetworkDevice
        identifier: site__devices
        cardinality: many
        kind: Generic
      - name: vlans
        peer: NetworkVlan
        identifier: site__vlans
        cardinality: many
        kind: Generic

  - name: Device
    namespace: Network
    label: Network device
    icon: mdi:router
    display_label: "{{ name__value }}"
    human_friendly_id: ["name__value"]
    inherit_from: ["CoreArtifactTarget"]
    attributes:
      - name: name
        kind: Text
        unique: true
      - name: description
        kind: Text
        optional: true
      # Hidden from the object list until a user adds the column with the Columns control
      - name: serial_number
        label: Serial number
        kind: Text
        optional: true
        display: extra
      - name: os_version
        label: OS version
        kind: Text
        optional: true
        display: extra
    relationships:
      - name: site
        peer: LocationSite
        identifier: site__devices
        cardinality: one
        optional: false
        kind: Attribute
      - name: interfaces
        peer: NetworkInterface
        cardinality: many
        kind: Component

  - name: Interface
    namespace: Network
    label: Network interface
    icon: mdi:ethernet
    display_label: "{{ name__value }}"
    human_friendly_id: ["device__name__value", "name__value"]
    uniqueness_constraints:
      - ["device", "name__value"]
    attributes:
      - name: name
        kind: Text
      - name: description
        kind: Text
        optional: true
      - name: enabled
        kind: Boolean
        default_value: true
    relationships:
      - name: device
        peer: NetworkDevice
        cardinality: one
        optional: false
        kind: Parent

  - name: Vlan
    namespace: Network
    label: VLAN
    icon: mdi:lan
    display_label: "{{ name__value }}"
    # A VLAN name and a VLAN ID are unique within a site, and repeat across sites.
    # vlan_id must not be unique on its own, or Infrahub refuses a number pool scoped by site.
    human_friendly_id: ["site__name__value", "name__value"]
    uniqueness_constraints:
      - ["site", "name__value"]
      - ["site", "vlan_id__value"]
    attributes:
      - name: name
        kind: Text
      # Allocated from the number pool created in Infrahub for NetworkVlan.vlan_id, scoped by site
      - name: vlan_id
        label: VLAN ID
        kind: Number
    relationships:
      # A pool scoped by site reads the site from the VLAN, so the relationship must be required and of cardinality one
      - name: site
        peer: LocationSite
        identifier: site__vlans
        cardinality: one
        optional: false
        kind: Attribute

  # A VLAN defined once. The site_vlans generator creates it as a NetworkVlan at every site.
  - name: VlanDefinition
    namespace: Network
    label: VLAN definition
    icon: mdi:lan-pending
    display_label: "{{ name__value }}"
    human_friendly_id: ["name__value"]
    attributes:
      - name: name
        kind: Text
        unique: true
      - name: description
        kind: Text
        optional: true

# yaml-language-server: $schema=https://schema.infrahub.app/python-sdk/repository-config/latest.json
---
objects:
  - objects

queries:
  - name: ibn_device_interfaces
    file_path: queries/ibn_device_interfaces.gql

jinja2_transforms:
  - name: ibn_device_interfaces
    description: Interface configuration for a device on the AUTONETOPS_IBN site
    query: ibn_device_interfaces
    template_path: transforms/templates/ibn_device_interfaces.j2

artifact_definitions:
  - name: AUTONETOPS_IBN interface configuration
    artifact_name: ibn-interface-config
    parameters:
      device: name__value
    content_type: text/plain
    targets: autonetops_ibn_examples
    transformation: ibn_device_interfaces

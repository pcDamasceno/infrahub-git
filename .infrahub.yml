# yaml-language-server: $schema=https://schema.infrahub.app/python-sdk/repository-config/latest.json
---
objects:
  - objects

queries:
  - name: device_config
    file_path: queries/device_config.gql
  - name: ibn_device_interfaces
    file_path: queries/ibn_device_interfaces.gql

jinja2_transforms:
  - name: startup_config
    description: Startup configuration for a network device
    query: device_config
    template_path: transforms/templates/startup_config.j2

  - name: ibn_device_interfaces
    description: Interface configuration for a device on the AUTONETOPS_IBN site
    query: ibn_device_interfaces
    template_path: transforms/templates/ibn_device_interfaces.j2

python_transforms:
  - name: interfaces_json
    class_name: InterfacesJson
    file_path: transforms/interfaces_json.py
    watch:
      files:
        - transforms/naming.py

artifact_definitions:
  - name: Startup configuration
    artifact_name: startup-config
    parameters:
      device: name__value
    content_type: text/plain
    targets: edge_routers
    transformation: startup_config

  - name: Interfaces as JSON
    artifact_name: interfaces-json
    parameters:
      device: name__value
    content_type: application/json
    targets: edge_routers
    transformation: interfaces_json

  - name: AUTONETOPS_IBN interface configuration
    artifact_name: ibn-interface-config
    parameters:
      device: name__value
    content_type: text/plain
    targets: autonetops_ibn_examples
    transformation: ibn_device_interfaces

check_definitions:
  - name: interface_descriptions
    class_name: InterfaceDescriptions
    file_path: checks/interface_descriptions.py
    targets: edge_routers
    parameters:
      device: name__value

generator_definitions:
  - name: loopbacks
    class_name: Loopbacks
    file_path: generators/loopbacks.py
    query: device_config
    targets: edge_routers
    parameters:
      device: name__value
    watch:
      files: []


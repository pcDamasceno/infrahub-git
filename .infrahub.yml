# yaml-language-server: $schema=https://schema.infrahub.app/python-sdk/repository-config/latest.json
---
schemas:
  - schemas

menus:
  - menus/menu.yml

objects:
  - objects

queries:
  - name: device_config
    file_path: queries/device_config.gql

jinja2_transforms:
  - name: startup_config
    description: Startup configuration of an edge router
    query: device_config
    template_path: transforms/templates/startup_config.j2

  - name: login_banner
    description: Login banner of an edge router
    query: device_config
    template_path: transforms/templates/login_banner.j2

artifact_definitions:
  - name: Startup configuration
    artifact_name: startup-config
    parameters:
      device: name__value
    content_type: text/plain
    targets: edge_routers
    transformation: startup_config

  - name: Login banner
    artifact_name: login-banner
    parameters:
      device: name__value
    content_type: text/plain
    targets: edge_routers
    transformation: login_banner

generator_definitions:
  - name: loopbacks
    file_path: generators/loopbacks.py
    class_name: Loopbacks
    query: device_config
    targets: edge_routers
    parameters:
      device: name__value
